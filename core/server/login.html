<!doctype html>
<html lang="{{.L}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.T.login_title}}</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1d2330;--muted:#6b7385;--line:#e3e6ec;--acc:#2f6fed;--acc-fg:#fff;--bad:#d64545;--ok:#1f9d55}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c24;--fg:#e6e9ef;--muted:#949cad;--line:#2a303c;--acc:#5b8cff;--acc-fg:#0b0e14;--bad:#f06a6a;--ok:#3ccf7c}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.card{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:var(--acc-fg);font-weight:800;font-size:18px}
.brand b{font-size:19px;display:block}
.brand .grow{flex:1}
.small{font-size:13px;color:var(--muted)}
.lang{font-size:12px;color:var(--muted);white-space:nowrap}
.lang a{color:var(--muted);text-decoration:none;cursor:pointer;padding:2px}
.lang a.on{color:var(--acc);font-weight:700}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 4px}
input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font:inherit}
input.code{font:600 24px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.18em;text-align:center;text-transform:uppercase}
button{width:100%;margin-top:20px;border:0;border-radius:9px;padding:12px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:var(--acc-fg)}
button:disabled{opacity:.6;cursor:default}
.msg{margin-top:12px;font-size:14px;min-height:1.5em;color:var(--bad)}
.msg.ok{color:var(--ok)}
.lan{text-align:center;margin-top:18px}
.lan .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin-bottom:12px}
.lan .or::before,.lan .or::after{content:"";flex:1;border-top:1px solid var(--line)}
.lan img{background:#fff;padding:8px;border-radius:10px;image-rendering:pixelated;max-width:100%}
.lan .small{margin-top:6px}
</style>
</head>
<body>
<form class="card" id="form" autocomplete="off">
  <div class="brand">
    <div class="logo">N</div>
    <div class="grow"><b>NASfone</b><span class="small">{{.T.login_sub}}</span></div>
    <span class="lang"><a data-lang="vi">VI</a>·<a data-lang="en">EN</a></span>
  </div>

  <label class="f" for="code">{{.T.login_code}}</label>
  <input id="code" class="code" type="text" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" placeholder="000 000" autocomplete="one-time-code" autofocus required>
  <div class="small" style="margin-top:4px">{{.T.login_code_hint}}</div>

  <label class="f" for="name">{{.T.login_name}}</label>
  <input id="name" type="text" maxlength="60">

  <button id="btn" type="submit">{{.T.login_btn}}</button>
  <div class="msg" id="msg"></div>
  <div class="small">{{.T.login_session}}</div>
  {{if .LAN}}
  <div class="lan">
    <div class="or"><span>{{.T.lan_or}}</span></div>
    <img id="lanQR" alt="QR" width="200" height="200">
    <div class="small">{{.T.lan_short}} <b id="lanShort" style="font:700 18px ui-monospace,Consolas,monospace;letter-spacing:.15em;color:var(--fg)"></b></div>
    <div class="small" id="lanMsg">{{.T.lan_wait}}</div>
    <div class="small">{{.T.lan_hint}}</div>
  </div>
  {{end}}
</form>

<script>
const NEXT = {{.Next}};
const LANG = {{.L}};
const T = {{.T}};
const tr = (k, ...a) => (T[k] || k).replace(/\{(\d+)\}/g, (_, i) => a[i]);
const $ = id => document.getElementById(id);
document.querySelectorAll('[data-lang]').forEach(a => {
  a.classList.toggle('on', a.dataset.lang === LANG);
  a.onclick = () => { document.cookie = 'nasfone_lang=' + a.dataset.lang + '; path=/; max-age=31536000; samesite=lax'; location.reload(); };
});
function guessName(){
  const ua = navigator.userAgent;
  const br = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : tr('browser');
  const os = /Windows/.test(ua) ? 'Windows' : /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Mac OS/.test(ua) ? 'macOS' : /Linux/.test(ua) ? 'Linux' : '';
  return os ? br + ' ' + tr('on') + ' ' + os : br;
}
$('name').value = guessName();
$('code').addEventListener('input', e => {
  let v = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
  if (v.length > 3) v = v.slice(0, 3) + ' ' + v.slice(3);
  e.target.value = v;
  if (v.length === 7) $('form').requestSubmit();
});
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('msg'), btn = $('btn');
  if (btn.disabled) return; // auto-submit and Enter must not send the code twice
  msg.className = 'msg'; msg.textContent = ''; btn.disabled = true;
  try {
    const r = await fetch('/__nasfone/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({code: $('code').value, name: $('name').value}),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { msg.className = 'msg ok'; msg.textContent = tr('login_ok'); location.replace(NEXT); return; }
    msg.textContent = (j.error || tr('err_status', r.status)) + (j.left ? tr('login_tries_left', j.left) : '');
  } catch (err) {
    msg.textContent = tr('err_network');
  }
  btn.disabled = false;
});

// LAN: show a one-time QR code; the phone app scans it and approves this browser.
if ({{.LAN}}) {
  let ticket = '', renewAt = 0;
  async function newTicket(){
    try {
      const r = await fetch('/__nasfone/lan/start', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { $('lanMsg').textContent = j.error || tr('err_status', r.status); ticket = ''; renewAt = Date.now() + 30000; return; }
      ticket = j.ticket; $('lanQR').src = j.qr; $('lanShort').textContent = j.short || '';
      renewAt = j.expires - 15000; // fresh code shortly before this one expires
      $('lanMsg').textContent = tr('lan_wait');
    } catch (e) { $('lanMsg').textContent = tr('err_network'); renewAt = Date.now() + 10000; }
  }
  async function poll(){
    if (!ticket || Date.now() > renewAt) await newTicket();
    if (ticket) {
      try {
        const r = await fetch('/__nasfone/lan/wait?t=' + encodeURIComponent(ticket), {cache: 'no-store'});
        if (r.status === 200) { $('lanMsg').className = 'small msg ok'; $('lanMsg').textContent = tr('login_ok'); location.replace(NEXT); return; }
        if (r.status === 410) ticket = '';
      } catch (e) {}
    }
    setTimeout(poll, 1500);
  }
  poll();
}
</script>
</body>
</html>
