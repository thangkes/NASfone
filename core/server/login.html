<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Đăng nhập – PocketNAS</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1d2330;--muted:#6b7385;--line:#e3e6ec;--acc:#2f6fed;--acc-fg:#fff;--bad:#d64545;--ok:#1f9d55}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c24;--fg:#e6e9ef;--muted:#949cad;--line:#2a303c;--acc:#5b8cff;--acc-fg:#0b0e14;--bad:#f06a6a;--ok:#3ccf7c}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.card{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:var(--acc-fg);font-weight:800;font-size:18px}
.brand b{font-size:19px;display:block}
.small{font-size:13px;color:var(--muted)}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 4px}
input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font:inherit}
input.code{font:600 24px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.18em;text-align:center;text-transform:uppercase}
button{width:100%;margin-top:20px;border:0;border-radius:9px;padding:12px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:var(--acc-fg)}
button:disabled{opacity:.6;cursor:default}
.msg{margin-top:12px;font-size:14px;min-height:1.5em;color:var(--bad)}
.msg.ok{color:var(--ok)}
</style>
</head>
<body>
<form class="card" id="form" autocomplete="off">
  <div class="brand"><div class="logo">P</div><div><b>PocketNAS</b><span class="small">Đăng nhập để truy cập dữ liệu</span></div></div>

  <label class="f" for="code">Mã 6 số đang hiện trên app</label>
  <input id="code" class="code" type="text" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" placeholder="000 000" autocomplete="one-time-code" autofocus required>
  <div class="small" style="margin-top:4px">Mở app PocketNAS Server để xem mã. Mã tự đổi mỗi phút và chỉ dùng được 1 lần.</div>

  <label class="f" for="name">Tên thiết bị (hiện trong app)</label>
  <input id="name" type="text" maxlength="60">

  <button id="btn" type="submit">Đăng nhập</button>
  <div class="msg" id="msg"></div>
  <div class="small">Phiên đăng nhập kết thúc khi bạn đóng trình duyệt (tối đa 24 giờ).</div>
</form>

<script>
const NEXT = {{.Next}};
const $ = id => document.getElementById(id);
function guessName(){
  const ua = navigator.userAgent;
  const br = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'Trình duyệt';
  const os = /Windows/.test(ua) ? 'Windows' : /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Mac OS/.test(ua) ? 'macOS' : /Linux/.test(ua) ? 'Linux' : '';
  return os ? br + ' trên ' + os : br;
}
$('name').value = guessName();
$('code').addEventListener('input', e => {
  let v = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
  if (v.length > 3) v = v.slice(0, 3) + ' ' + v.slice(3);
  e.target.value = v;
  if (v.length === 7) $('form').requestSubmit();
});
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('msg'), btn = $('btn');
  if (btn.disabled) return; // auto-submit and Enter must not send the code twice
  msg.className = 'msg'; msg.textContent = ''; btn.disabled = true;
  try {
    const r = await fetch('/__pnas/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({code: $('code').value, name: $('name').value}),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { msg.className = 'msg ok'; msg.textContent = 'Đăng nhập thành công…'; location.replace(NEXT); return; }
    msg.textContent = (j.error || 'Lỗi ' + r.status) + (j.left ? ` Còn ${j.left} lần thử.` : '');
  } catch (err) {
    msg.textContent = 'Không kết nối được tới server.';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
