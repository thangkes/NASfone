<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NASfone Server</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1d2330;--muted:#6b7385;--line:#e3e6ec;--acc:#1f9d55;--acc-fg:#fff;--ok:#1f9d55;--warn:#c27c0e;--bad:#d64545;--chip:#e8f5ee;--admin:#b42318;--admin-bg:#fde8e8;--user:#2f6fed;--user-bg:#eef2fd}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c24;--fg:#e6e9ef;--muted:#949cad;--line:#2a303c;--acc:#3ccf7c;--acc-fg:#0b0e14;--ok:#3ccf7c;--warn:#e5a53a;--bad:#f06a6a;--chip:#1c2a23;--admin:#ff8a80;--admin-bg:#3a1d1d;--user:#7aa2ff;--user-bg:#1f2737}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;overflow-y:auto}
main{padding:18px 18px 24px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:42px;height:42px;flex:none}
header h1{font-size:18px;margin:0;line-height:1.2}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;margin-top:2px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.ok .dot{background:var(--ok)} .ok{color:var(--ok)}
.starting .dot,.login .dot{background:var(--warn);animation:blink 1s infinite} .starting,.login{color:var(--warn)}
.error .dot{background:var(--bad)} .error{color:var(--bad)}
@keyframes blink{50%{opacity:.3}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.card.alert{border-color:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 25%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
button{font:inherit;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--chip);color:var(--fg)}
button.pri{background:var(--acc);color:var(--acc-fg);font-weight:600}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
button.small{padding:5px 10px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number]{font:inherit;width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.muted{color:var(--muted);font-size:12px}
.mono{font-family:Consolas,ui-monospace,monospace}
.code{font:700 34px/1.1 Consolas,ui-monospace,monospace;letter-spacing:.12em}
.code.admin{color:var(--admin)} .code.user{color:var(--user)}
.lbl{font-size:12px;font-weight:700;margin-top:8px}
.lbl.admin{color:var(--admin)} .lbl.user{color:var(--user)}
.bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.bar div{height:100%;background:var(--acc);transition:width .9s linear}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item b{display:block}
.role{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;margin-right:4px}
.role.admin{background:var(--admin-bg);color:var(--admin)}
.role.user{background:var(--user-bg);color:var(--user)}
.short{font:700 22px Consolas,ui-monospace,monospace;letter-spacing:.15em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.kv a{color:var(--acc);cursor:pointer;word-break:break-all}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px}
select{font:inherit;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);cursor:pointer;transition:.15s}
.switch span::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked + span{background:var(--acc)}
.switch input:checked + span::before{transform:translateX(18px)}
.notice{font-size:12px;border-radius:8px;padding:8px 10px;margin-bottom:12px;background:var(--admin-bg);color:var(--admin);word-break:break-word}
.notice.info{background:var(--chip);color:var(--fg)}
pre.log{font:11px/1.45 Consolas,monospace;max-height:220px;overflow:auto;background:var(--bg);border-radius:8px;padding:8px;margin:0 0 8px;white-space:pre-wrap;user-select:text}
.qr{background:#fff;padding:8px;border-radius:10px;image-rendering:pixelated;display:block;margin:8px auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal .card{width:min(440px,100%);margin:0}
textarea{width:100%;height:58px;resize:none;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:11px Consolas,monospace;padding:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <img class="logo" src="{{ICON}}" alt="">
    <div class="grow">
      <h1>NASfone Server</h1>
      <div class="pill" id="pill"><span class="dot"></span><span id="statusText">…</span></div>
    </div>
    <span class="muted" id="ver"></span>
  </header>

  <div class="notice info row" id="updRow" hidden><span class="grow" id="updText"></span><button class="pri small" id="btnUpd" onclick="nsUpdate()"></button></div>

  <!-- First run -->
  <section id="setup" hidden>
    <div class="card">
      <h2 data-i18n="w_setup_title"></h2>
      <div class="muted" data-i18n="w_setup_intro"></div>
      <label class="f" data-i18n="w_folder"></label>
      <div class="row"><input type="text" id="sRoot" class="grow"><button onclick="pick('sRoot')" data-i18n="w_choose"></button></div>
      <label class="f" data-i18n="w_hostname"></label>
      <input type="text" id="sHost">
      <div class="notice" id="sErr" hidden style="margin-top:10px"></div>
      <div class="row" style="margin-top:12px"><button class="pri grow" onclick="setup()" data-i18n="w_start"></button></div>
    </div>
  </section>

  <section id="main" hidden>
    <div class="row" style="margin-bottom:12px">
      <button class="pri grow" id="btnToggle" onclick="nsToggle()"></button>
      <button id="btnWeb" onclick="openWeb()" data-i18n="w_open_web"></button>
      <button onclick="nsOpenFolder()" data-i18n="w_open_folder"></button>
    </div>

    <!-- LAN requests (PC has no camera: approve here) -->
    <div class="card alert" id="pendCard" hidden>
      <h2 data-i18n="w_lan_requests"></h2>
      <div class="muted" data-i18n="w_lan_req_hint"></div>
      <div id="pendList"></div>
    </div>

    <div id="runOnly">
      <div class="card">
        <h2 data-i18n="w_codes_title"></h2>
        <div class="lbl admin" data-i18n="w_admin_label"></div>
        <div class="row"><span class="code admin grow" id="cAdmin">— —</span><button class="small" onclick="copyCode('admin',this)" data-i18n="w_copy"></button></div>
        <div class="lbl user" data-i18n="w_user_label"></div>
        <div class="row"><span class="code user grow" id="cUser">— —</span><button class="small" onclick="copyCode('user',this)" data-i18n="w_copy"></button></div>
        <div class="bar"><div id="cBar" style="width:0"></div></div>
        <div class="muted" id="cNext" style="text-align:center"></div>
      </div>

      <div class="card">
        <h2 data-i18n="w_account"></h2>
        <div id="acct" class="kv"></div>
        <div class="row" style="margin-top:10px">
          <button class="pri" id="btnLogin" onclick="login()" data-i18n="w_sign_in"></button>
          <button id="btnLogout" onclick="logout()" data-i18n="w_sign_out"></button>
        </div>
      </div>

      <div class="card">
        <h2 data-i18n="w_addresses"></h2>
        <div id="addr" class="kv"></div>
        <div class="muted" style="margin-top:8px"><span data-i18n="w_fp"></span>: <span class="mono" id="fp"></span></div>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="w_funnel"></h2>
      <div class="set"><span data-i18n="w_funnel_on"></span><label class="switch"><input type="checkbox" id="funnel" onchange="nsSetFunnel(this.checked)"><span></span></label></div>
      <div class="muted" id="funnelTv"></div>
      <button class="small" id="funnelFix" hidden onclick="nsOpenURL(S.status.funnelHelpURL)" data-i18n="w_funnel_fix" style="margin-top:6px"></button>
    </div>

    <div class="card">
      <h2 data-i18n="w_lan"></h2>
      <div class="set"><span data-i18n="w_lan_port"></span><input type="number" id="lanPort" min="1024" max="65535" style="width:110px"></div>
      <div class="set"><span data-i18n="w_lan_on"></span><label class="switch"><input type="checkbox" id="lanOn" onchange="setLan(this)"><span></span></label></div>
      <div class="muted" data-i18n="w_lan_hint"></div>
      <div class="notice" id="lanErr" hidden style="margin:8px 0 0"></div>
    </div>

    <div class="card" id="pairedCard">
      <h2 data-i18n="w_paired"></h2>
      <div id="pairedList"></div>
      <div class="row" style="margin-top:8px"><button class="grow" id="btnPairNew" onclick="newPair()" data-i18n="w_pair_new"></button></div>
    </div>

    <div class="card" id="devCard">
      <h2 data-i18n="w_sessions"></h2>
      <div id="devList"></div>
      <div class="row" style="margin-top:8px"><button class="danger small" onclick="revokeAll()" data-i18n="w_revoke_all"></button></div>
    </div>

    <div class="card">
      <h2 data-i18n="w_settings"></h2>
      <label class="f" data-i18n="w_folder"></label>
      <div class="row"><input type="text" id="eRoot" class="grow"><button onclick="pick('eRoot')" data-i18n="w_choose"></button></div>
      <label class="f" data-i18n="w_hostname"></label>
      <input type="text" id="eHost">
      <label class="f" data-i18n="w_control"></label>
      <input type="text" id="eControl" placeholder="https://…">
      <div class="set"><span data-i18n="w_verbose"></span><label class="switch"><input type="checkbox" id="eVerbose"><span></span></label></div>
      <div class="notice" id="eErr" hidden></div>
      <div class="row"><button class="pri" id="btnSave" onclick="save()" data-i18n="w_save"></button><span class="muted grow" data-i18n="w_save_note"></span></div>
      <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:6px">
        <div class="set"><span data-i18n="w_autostart"></span><label class="switch"><input type="checkbox" id="auto" onchange="setAuto(this)"><span></span></label></div>
        <div class="set"><span data-i18n="w_language"></span>
          <select id="langSel" onchange="setLang(this.value)"><option value="" data-i18n="w_lang_auto"></option><option value="vi">Tiếng Việt</option><option value="en">English</option></select>
        </div>
        <div class="row" style="margin-top:8px"><button class="grow" onclick="switchRole()" data-i18n="w_switch_client"></button></div>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="w_log"></h2>
      <pre class="log" id="log"></pre>
      <div class="row"><button class="small" onclick="nsCopy(S.logs.join('\n'))" data-i18n="w_copy_log"></button><button class="small" onclick="nsOpenLogs()" data-i18n="w_logs_folder"></button></div>
    </div>
  </section>
</main>

<!-- Pairing invite -->
<div class="modal" id="invModal" hidden>
  <div class="card">
    <h2 data-i18n="w_invite_title"></h2>
    <div id="invAsk">
      <div class="muted" data-i18n="w_invite_role_q"></div>
      <div class="row" style="margin-top:10px">
        <button class="grow" style="color:var(--admin)" onclick="invite('admin')" data-i18n="w_admin"></button>
        <button class="grow" style="color:var(--user)" onclick="invite('user')" data-i18n="w_user"></button>
      </div>
    </div>
    <div id="invShow" hidden>
      <div id="invRole"></div>
      <img class="qr" id="invQR" width="240" height="240" alt="QR">
      <textarea id="invText" readonly></textarea>
      <div class="muted" data-i18n="w_invite_hint"></div>
      <div class="muted" style="margin-top:4px"><span data-i18n="w_fp"></span>: <span class="mono" id="invFP"></span></div>
    </div>
    <div class="notice" id="invErr" hidden style="margin-top:8px"></div>
    <div class="row" style="margin-top:12px">
      <button class="pri grow" id="invCopy" hidden onclick="copyInvite(this)" data-i18n="w_copy_invite"></button>
      <button class="grow" onclick="closeInvite()" data-i18n="w_close"></button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let T = {}, S = {status: {}, logs: []}, filled = false, keys = {};
const tr = (k, ...a) => { let s = T[k] || k; a.forEach(v => s = s.replace('%s', v)); return s; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shortFP = fp => (fp || '').toUpperCase().slice(0, 16).replace(/(.{4})(?=.)/g, '$1-');
const when = iso => { if (!iso) return '—'; const d = new Date(iso); if (isNaN(d) || d.getFullYear() < 2000) return '—';
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + ' ' + d.toLocaleDateString([], {day:'2-digit', month:'2-digit'}); };
// Re-render a block only when its data changed (keeps buttons/focus stable).
function changed(name, v){ const k = JSON.stringify(v); if (keys[name] === k) return false; keys[name] = k; return true; }

async function applyI18n(){
  T = await nsDict();
  document.documentElement.lang = await nsLang();
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = tr(e.dataset.i18n));
  keys = {}; // texts inside lists changed too
}

function render(s){
  S = s;
  const st = s.status || {};
  $('pill').className = 'pill ' + s.statusCode;
  $('statusText').textContent = s.statusText.replace(/^[●○]\s*/, ''); // the pill already has a dot
  $('ver').textContent = 'v' + s.version;
  $('setup').hidden = s.configured;
  $('main').hidden = !s.configured;
  $('updRow').hidden = !s.update;
  if (s.update) {
    $('updText').textContent = tr('w_update_avail', s.update);
    $('btnUpd').textContent = tr(s.updating ? 'w_updating' : 'w_update_btn');
    $('btnUpd').disabled = s.updating;
  }
  if (!s.configured) return;

  $('btnToggle').textContent = tr(s.running ? 'w_stop' : 'w_start_server');
  $('btnToggle').className = s.running ? 'grow' : 'pri grow';
  $('runOnly').hidden = !s.running;
  $('btnWeb').disabled = !(st.funnelURL || st.dnsName);
  $('btnPairNew').disabled = !s.running;

  if (!filled) { // settings inputs: fill once so typing is not overwritten
    filled = true;
    $('eRoot').value = s.settings.rootDir; $('eHost').value = s.settings.hostname;
    $('eControl').value = s.settings.controlURL || ''; $('eVerbose').checked = s.settings.verbose;
    $('lanPort').value = s.settings.lanPort;
  }
  $('funnel').checked = s.settings.funnel;
  $('lanOn').checked = s.settings.lanEnabled;
  $('lanPort').disabled = s.settings.lanEnabled;
  $('auto').checked = s.autostart;
  $('langSel').value = s.settings.lang || '';
  $('lanErr').hidden = !st.lanError; $('lanErr').textContent = 'LAN: ' + (st.lanError || '');

  // Funnel
  $('funnelTv').textContent = st.funnelError ? '⚠ ' + st.funnelError + ' ' + tr('w_funnel_retry')
    : st.funnelURL ? tr('w_funnel_public') + ' ' + st.funnelURL
    : s.settings.funnel ? tr('w_funnel_wait') : tr('w_funnel_off');
  $('funnelFix').hidden = !st.funnelHelpURL;

  if (s.running) renderRunning(s, st);
  else { renderPaired([]); renderDevices([]); renderPending([]); }
  renderLog(s.logs || []);
}

function renderRunning(s, st){
  // Codes
  const c = s.codes;
  if (c) {
    $('cAdmin').textContent = c.admin; $('cUser').textContent = c.user;
    const left = Math.max(0, Math.round((c.expires - Date.now()) / 1000));
    $('cBar').style.width = (100 * left / (c.step || 60)) + '%';
    $('cNext').textContent = tr('w_codes_next', '0:' + String(left).padStart(2, '0'));
  }
  // Account
  if (changed('acct', [st.backendState, st.loginName, st.tailnetName])) {
    $('acct').innerHTML = st.backendState === 'Running'
      ? `<span>${esc(tr('w_signed_in_as'))}</span><span>${esc(st.loginName)}</span><span>${esc(tr('w_tailnet'))}</span><span>${esc(st.tailnetName)}</span>`
      : `<span style="grid-column:1/3">${esc(tr('w_not_signed'))}</span>`;
  }
  $('btnLogin').hidden = st.backendState === 'Running';
  $('btnLogout').hidden = st.backendState !== 'Running';
  // Addresses
  const rows = [];
  if (st.dnsName) rows.push(['Tailnet', 'http://' + st.dnsName]);
  if (st.tailscaleIPs && st.tailscaleIPs.length) rows.push(['Tailnet IP', 'http://' + st.tailscaleIPs[0]]);
  if (st.funnelURL) rows.push([tr('w_addr_funnel'), st.funnelURL]);
  (st.lanURLs || []).forEach(u => rows.push([tr('w_addr_lan'), u]));
  if (changed('addr', rows)) {
    $('addr').innerHTML = rows.length ? rows.map(([k, v]) => `<span>${esc(k)}</span><a data-u="${esc(v)}">${esc(v)}</a>`).join('') : '<span>—</span>';
    $('addr').querySelectorAll('a').forEach(a => a.onclick = () => nsOpenURL(a.dataset.u));
  }
  $('fp').textContent = s.fp || '';
  renderPending(s.pending || []);
  renderPaired(s.paired || []);
  renderDevices(s.devices || []);
}

function renderPending(list){
  $('pendCard').hidden = !list.length;
  if (!changed('pend', list.map(p => p.ticket))) return;
  $('pendList').innerHTML = list.map(p => `
    <div class="item"><div class="grow"><span class="short">${esc(p.short)}</span><div class="muted">${esc(p.ip)} • ${esc(p.agent)}</div></div>
    <button class="pri small" data-a="${esc(p.ticket)}">${esc(tr('w_allow'))}</button>
    <button class="small" data-r="${esc(p.ticket)}">${esc(tr('w_deny'))}</button></div>`).join('');
  $('pendList').querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
    const err = await nsApproveLan(b.dataset.a); if (err) alert(err); keys.pend = ''; refresh(); });
  $('pendList').querySelectorAll('[data-r]').forEach(b => b.onclick = async () => {
    await nsRejectLan(b.dataset.r); keys.pend = ''; refresh(); });
}

function renderPaired(list){
  const view = list.map(d => [d.id, d.role, d.name, d.lastSeen, d.via]);
  if (!changed('paired', [view, T.w_none])) return;
  if (!list.length) { $('pairedList').innerHTML = `<div class="muted">${esc(tr('w_none'))}</div>`; return; }
  $('pairedList').innerHTML = list.map(d => {
    const admin = d.role === 'admin';
    return `<div class="item"><div class="grow"><b><span class="role ${admin ? 'admin' : 'user'}">${admin ? 'ADMIN' : 'USER'}</span>${esc(d.name)}</b>
      <div class="muted">${esc(d.platform)} • ${esc(tr('w_key'))} ${esc(shortFP(d.fp))}<br>${esc(tr('w_last_seen'))} ${when(d.lastSeen)}${d.via ? ' ' + esc(tr('w_via')) + ' ' + esc(d.via) : ''} • ${esc(tr('w_paired_at'))} ${when(d.created)}</div></div>
      <button class="small" data-role="${esc(d.id)}|${admin ? 'user' : 'admin'}">${esc(tr(admin ? 'w_make_user' : 'w_make_admin'))}</button>
      <button class="danger small" data-rev="${esc(d.id)}">${esc(tr('w_revoke'))}</button></div>`;
  }).join('');
  $('pairedList').querySelectorAll('[data-role]').forEach(b => b.onclick = async () => {
    const [id, role] = b.dataset.role.split('|'); await nsSetRole(id, role); keys.paired = ''; refresh(); });
  $('pairedList').querySelectorAll('[data-rev]').forEach(b => b.onclick = async () => {
    if (!confirm(tr('w_revoke_q'))) return; await nsRevokePaired(b.dataset.rev); keys.paired = ''; refresh(); });
}

function renderDevices(list){
  const view = list.map(d => [d.id, d.name, d.lastSeen, d.lastIP]);
  if (!changed('dev', [view, T.w_none])) return;
  if (!list.length) { $('devList').innerHTML = `<div class="muted">${esc(tr('w_none'))}</div>`; return; }
  $('devList').innerHTML = list.map(d => {
    const admin = d.role === 'admin';
    return `<div class="item"><div class="grow"><b><span class="role ${admin ? 'admin' : 'user'}">${admin ? 'ADMIN' : 'USER'}</span>${esc(d.name)}</b>
      <div class="muted">${esc(d.via)} • ${esc(d.lastIP)} • ${esc(tr('w_last_seen'))} ${when(d.lastSeen)} • ${esc(tr('w_expires'))} ${when(d.expires)}</div></div>
      <button class="danger small" data-rev="${esc(d.id)}">${esc(tr('w_revoke'))}</button></div>`;
  }).join('');
  $('devList').querySelectorAll('[data-rev]').forEach(b => b.onclick = async () => {
    await nsRevokeDevice(b.dataset.rev); keys.dev = ''; refresh(); });
}

function renderLog(lines){
  const text = lines.join('\n');
  if (!changed('log', text)) return;
  const el = $('log'), atEnd = el.scrollTop + el.clientHeight >= el.scrollHeight - 8;
  el.textContent = text;
  if (atEnd) el.scrollTop = el.scrollHeight;
}

// ---- actions -----------------------------------------------------------------
async function pick(id){ $(id).value = await nsChooseFolder($(id).value); }

async function setup(){
  const err = await nsSaveSettings({rootDir: $('sRoot').value, hostname: $('sHost').value, controlURL: '', verbose: false});
  $('sErr').hidden = !err; $('sErr').textContent = err || '';
  if (!err) { filled = false; refresh(); }
}

async function save(){
  const err = await nsSaveSettings({rootDir: $('eRoot').value, hostname: $('eHost').value, controlURL: $('eControl').value, verbose: $('eVerbose').checked});
  $('eErr').hidden = !err; $('eErr').textContent = err || '';
  if (!err) { const b = $('btnSave'); b.textContent = tr('w_saved'); setTimeout(() => b.textContent = tr('w_save'), 1500); }
}

async function setLan(cb){
  const err = await nsSetLan(cb.checked, parseInt($('lanPort').value, 10) || 0);
  if (err) { cb.checked = false; alert(err); }
  refresh();
}
async function setAuto(cb){ const err = await nsSetAutostart(cb.checked); if (err) { cb.checked = !cb.checked; alert(err); } }
async function setLang(l){ await nsSetLang(l); await applyI18n(); refresh(); }
async function login(){ const err = await nsLogin(); if (err) alert(err); }
async function logout(){ if (!confirm(tr('w_sign_out_q'))) return; const err = await nsLogout(); if (err) alert(err); }
function openWeb(){ const st = S.status || {}; const u = st.funnelURL || (st.dnsName ? 'http://' + st.dnsName : ''); if (u) nsOpenURL(u); }
function switchRole(){ if (confirm(tr('w_switch_client_q'))) nsSwitchRole(); }
async function revokeAll(){ if (!confirm(tr('w_revoke_all_q'))) return; await nsRevokeAllDevices(); keys.dev = ''; refresh(); }
function copyCode(which, b){
  const c = S.codes; if (!c) return;
  nsCopy(c[which].replace(/\s/g, ''));
  b.textContent = tr('w_copied'); setTimeout(() => b.textContent = tr('w_copy'), 1200);
}

let inv = null;
function newPair(){
  inv = null;
  $('invAsk').hidden = false; $('invShow').hidden = true; $('invCopy').hidden = true; $('invErr').hidden = true;
  $('invModal').hidden = false;
}
async function invite(role){
  const r = await nsNewInvite(role);
  if (r.error) { $('invErr').hidden = false; $('invErr').textContent = r.error; return; }
  inv = r;
  $('invAsk').hidden = true; $('invShow').hidden = false; $('invCopy').hidden = false;
  $('invRole').innerHTML = `<span class="role ${role}">${role === 'admin' ? 'ADMIN' : 'USER'}</span>`;
  $('invQR').src = r.qr || ''; $('invText').value = r.invite; $('invFP').textContent = r.fp || '';
}
function copyInvite(b){ if (!inv) return; nsCopy(inv.invite); b.textContent = tr('w_copied'); setTimeout(() => b.textContent = tr('w_copy_invite'), 1200); }
function closeInvite(){ $('invModal').hidden = true; inv = null; keys.paired = ''; }

async function refresh(){ try { render(await nsState()); } catch (e) {} }

(async () => {
  await applyI18n();
  const d = await nsDefaults();
  $('sRoot').value = d.rootDir; $('sHost').value = d.hostname;
  await refresh();
  setInterval(refresh, 1000);
})();
</script>
</body>
</html>
